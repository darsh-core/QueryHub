services:
  - type: web
    name: queryhub-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen-2.5-32b
      - key: DATABASE_URL
        value: sqlite:///./lms.db
